[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Customer service LLM agent for Empório da Música (function calling over SQLite data and store policies)"
readme = "README.md"
authors = [
    { name = "Victor Lis Bronzo", email = "victorlisbronzo1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.0",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[project.scripts]
emporio-da-musica-agent = "emporio_da_musica_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
